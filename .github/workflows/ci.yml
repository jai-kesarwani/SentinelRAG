name: SentinelRAG CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # =========================================================================
  # 1. Backend Verification & Security Test Suite
  # =========================================================================
  backend-test:
    name: Backend Pytest Suite & Security Verification
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Tests
        env:
          APP_ENV: test
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DATABASE: sentinelrag_test
          CHROMA_PERSIST_DIR: ./chroma_test_data
          JWT_SECRET: test-jwt-secret-key-32-bytes-minimum-length-for-ci
          GEMINI_API_KEY: ci-synthetic-placeholder-key
        run: |
          python -m pytest backend/tests/ -v

  # =========================================================================
  # 2. Frontend Typecheck & Production Build
  # =========================================================================
  frontend-build:
    name: Frontend TypeScript & Vite Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run TypeScript & Vite Build
        working-directory: ./frontend
        run: npm run build

  # =========================================================================
  # 3. Dockerfile Validation & Image Build
  # =========================================================================
  docker-validation:
    name: Docker Build & Layer Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: sentinelrag-backend:ci

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: sentinelrag-frontend:ci

